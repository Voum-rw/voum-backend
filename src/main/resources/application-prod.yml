spring:
  datasource:
    # prepareThreshold=0 disables server-side prepared statements.
    # This is REQUIRED when connecting through Supabase PgBouncer in transaction-pooling
    # mode, which does not support named prepared statements ("S_X already exists" error).
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      # Tell HikariCP not to issue a "SET application_name" on connection acquire;
      # PgBouncer in transaction mode does not persist session-level settings.
      connection-init-sql: "SELECT 1"
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        show_sql: false
        format_sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      connect-timeout: 2000ms
      timeout: 2000ms

  flyway:
    enabled: true
    baseline-on-migrate: true

  # Gmail SMTP — credentials are injected via Render environment variables
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false


server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
